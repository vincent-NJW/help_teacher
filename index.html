<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>课堂奖励系统</title>
<style>
body {
    margin:0;
    font-family:"Comic Sans MS","Microsoft YaHei",sans-serif;
    background: linear-gradient(135deg,#FFFAE3,#FFF3E0);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    background:white;
    padding:30px;
    border-radius:20px;
    width:500px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    position:relative;
    z-index:1;
}
h1{
    color:#ff5722;
}
button{
    background:#ff9800;
    border:none;
    padding:12px 30px;
    font-size:18px;
    border-radius:30px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    transition:0.3s;
    margin:10px;
}
button:hover{
    transform:scale(1.05);
}
.slider-container {
    margin-top:15px;
}
input[type=range] {
    -webkit-appearance:none;
    width:100%;
    height:12px;
    border-radius:10px;
    background: linear-gradient(90deg,#ffcc80,#ffb74d);
    outline:none;
    margin-top:8px;
}
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#ff6f00;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
}
input[type=range]::-moz-range-thumb {
    width:28px;
    height:28px;
    border-radius:50%;
    background:#ff6f00;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
}
#progress{
    width:100%;
    height:30px;
    background:#ffe0b2;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
}
#bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#66bb6a,#43a047);
    transition:0.1s linear;
}
.volume-bar-container {
    position: fixed;
    bottom:20px;
    left:20px;
    width:40px;
    height:150px;
    background:#ffe0b2;
    border-radius:20px;
    overflow:hidden;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    display:none;
    z-index:10;
}
.volume-bar {
    position:absolute;
    bottom:0;
    width:100%;
    height:0%;
    background:linear-gradient(to top,#66bb6a,#43a047);
    transition:0.05s linear;
}
.volume-threshold {
    position:absolute;
    width:100%;
    height:3px;
    background:red;
    bottom:8%;
}
.page{display:none;}
.page.active{display:block;}
canvas{border-radius:15px; cursor:pointer; margin-top:20px; box-shadow:0 5px 10px rgba(0,0,0,0.2);}
#readPrize{
    font-size:24px;
    font-weight:bold;
    color:#ff3d00;
    margin-top:20px;
}
</style>
</head>
<body>

<div class="container">

<!-- 首页 -->
<div id="home" class="page active">
    <h1>🎉 课堂奖励系统</h1>
    <div class="slider-container">
        <label>朗读时间控制 (秒)</label>
        <input type="range" id="timeSlider" min="10" max="900" value="60" step="10">
    </div>
    <div class="slider-container">
        <label>声音阈值控制</label>
        <input type="range" id="thresholdSlider" min="1" max="100" value="8" step="1">
    </div>
    <button onclick="chooseMode('scratch')">刮刮乐奖励</button>
    <button onclick="chooseMode('read')">朗读进度奖励</button>
</div>

<!-- 刮刮乐页面 -->
<div id="scratchPage" class="page">
    <h1>🎟️ 刮刮乐奖励</h1>
    <canvas id="scratch" width="500" height="200"></canvas>
    <button onclick="backHome()">返回首页</button>
</div>

<!-- 朗读页面 -->
<div id="readPage" class="page">
    <h1>🎤 大声朗读挑战</h1>
    <button onclick="startRead()">开始朗读</button>
    <div id="progress">
        <div id="bar"></div>
    </div>
    <div id="readPrize"></div>
    <button onclick="backHome()">返回首页</button>
</div>

<!-- 屏幕左下音量进度条 -->
<div class="volume-bar-container" id="volumeContainer">
    <div class="volume-bar" id="volumeBar"></div>
    <div class="volume-threshold" id="thresholdLine"></div>
</div>

<script>
// 奖励及对应概率
const prizes = [
    {name:"🍪 小零食一份", prob:0.02},
    {name:"⭐ 小红花", prob:0.05},
    {name:"🎁 神秘奖励", prob:0.01},
    {name:"🎉 减免一次作业", prob:0.01},
    {name:"👏 老师表扬", prob:0.01},
    {name:"😅 谢谢参与", prob:0.9}
];

// 页面切换
function chooseMode(mode){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    if(mode==='scratch'){
        document.getElementById('scratchPage').classList.add('active');
        initScratch();
    } else {
        document.getElementById('readPage').classList.add('active');
        resetRead();
    }
}
function backHome(){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('home').classList.add('active');
    resetRead();
}

// ===== 刮刮乐 =====
function initScratch(){
    const canvas = document.getElementById('scratch');
    const ctx = canvas.getContext('2d');
    const rand = Math.random();
    let sum = 0;
    let prize = prizes[prizes.length-1].name;
    for(let i=0;i<prizes.length;i++){
        sum += prizes[i].prob;
        if(rand <= sum){
            prize = prizes[i].name;
            break;
        }
    }

    const prizeCanvas = document.createElement('canvas');
    prizeCanvas.width = canvas.width;
    prizeCanvas.height = canvas.height;
    const pctx = prizeCanvas.getContext('2d');
    pctx.fillStyle = "#ff3d00";
    pctx.font = "36px Comic Sans MS";
    pctx.textAlign = "center";
    pctx.textBaseline = "middle";
    pctx.fillText(prize, canvas.width/2, canvas.height/2);

    const overlay = document.createElement('canvas');
    overlay.width = canvas.width;
    overlay.height = canvas.height;
    const octx = overlay.getContext('2d');
    octx.fillStyle = "#ccc";
    octx.fillRect(0,0,overlay.width,overlay.height);

    ctx.drawImage(prizeCanvas,0,0);
    ctx.drawImage(overlay,0,0);

    let isDrawing = false;
    function startDraw(e){ isDrawing=true; draw(e); }
    function endDraw(){ isDrawing=false; }
    function draw(e){
        if(!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX)-rect.left;
        const y = (e.clientY || e.touches[0].clientY)-rect.top;

        octx.globalCompositeOperation='destination-out';
        octx.beginPath();
        octx.arc(x,y,25,0,Math.PI*2);
        octx.fill();

        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(prizeCanvas,0,0);
        ctx.drawImage(overlay,0,0);
    }

    canvas.addEventListener('mousedown',startDraw);
    canvas.addEventListener('mouseup',endDraw);
    canvas.addEventListener('mouseleave',endDraw);
    canvas.addEventListener('mousemove',draw);
    canvas.addEventListener('touchstart',e=>{ isDrawing=true; draw(e.touches[0]); });
    canvas.addEventListener('touchmove',e=>{ draw(e.touches[0]); });
    canvas.addEventListener('touchend',endDraw);
}

// ===== 朗读奖励 =====
let progress = 0;
let readAnimation = null;
let totalTime = 60; 
let startTimestamp = null;

const volumeContainer = document.getElementById('volumeContainer');
const volumeBar = document.getElementById('volumeBar');
const thresholdLine = document.getElementById('thresholdLine');
const bar = document.getElementById('bar');
const readPrizeDiv = document.getElementById('readPrize');

function startRead(){
    totalTime = parseInt(document.getElementById('timeSlider').value);
    const threshold = parseInt(document.getElementById('thresholdSlider').value)/100;
    thresholdLine.style.bottom=(threshold*100)+"%";

    volumeContainer.style.display='block';
    progress=0;
    bar.style.width="0%";
    readPrizeDiv.innerHTML="";
    startTimestamp = performance.now();

    navigator.mediaDevices.getUserMedia({audio:true})
    .then(stream=>{
        const audioContext = new AudioContext();
        const analyser = audioContext.createAnalyser();
        const mic = audioContext.createMediaStreamSource(stream);
        mic.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);

        function detect(){
            analyser.getByteFrequencyData(data);
            let sum = 0;
            for(let i=0;i<data.length;i++) sum+=data[i];
            let volume = sum/data.length/255;
            volumeBar.style.height=(volume*100)+"%";

            let speedFactor = 100/totalTime;
            if(volume>=threshold){
                progress += speedFactor/60;
            } else {
                progress -= speedFactor/120;
            }
            if(progress<0) progress=0;
            if(progress>100) progress=100;
            bar.style.width=progress+"%";

            if(progress>=100){
                showReadPrize();
                return;
            }
            readAnimation = requestAnimationFrame(detect);
        }
        readAnimation = requestAnimationFrame(detect);
    });
}

function resetRead(){
    progress=0;
    bar.style.width="0%";
    volumeBar.style.height="0%";
    readPrizeDiv.innerHTML="";
    volumeContainer.style.display='none';
    if(readAnimation) cancelAnimationFrame(readAnimation);
}

function showReadPrize(){
    const rand = Math.random();
    let sum = 0;
    let prize = prizes[prizes.length-1].name;
    for(let i=0;i<prizes.length;i++){
        sum += prizes[i].prob;
        if(rand <= sum){
            prize = prizes[i].name;
            break;
        }
    }
    readPrizeDiv.innerHTML = "🎉 奖励："+prize;
}
</script>

</body>
</html>
